name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no job can write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, unit, build, audit, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency audit (fails on moderate or higher)
        run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: No privileged keys in the browser bundle
        run: npm run check:secrets
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-offline-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  supabase:
    name: Database, integration and online e2e (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0
      # supabase/config.toml publishes host ports 55320-55329, which sit inside Linux's ephemeral range
      # (32768-60999). Docker's parallel image pulls open many outbound sockets on random ephemeral ports,
      # and one landing on e.g. 55322 makes the container's host-port bind fail with "address already in use".
      # Reserving the range stops the kernel from auto-assigning it; explicit binds still work.
      # Keep this range in sync with the ports in supabase/config.toml.
      - name: Reserve Supabase host ports from the ephemeral range
        run: |
          sudo sysctl -w net.ipv4.ip_local_reserved_ports=55320-55329
          sysctl net.ipv4.ip_local_port_range
      - name: Start isolated local Supabase (synthetic data only)
        run: supabase start
      # The local stack's keys are Supabase's fixed, publicly documented demo values for an ephemeral container,
      # not secrets. No real project credentials exist in this workflow.
      - name: Export local stack settings
        run: |
          supabase status -o json > "$RUNNER_TEMP/sb.json"
          {
            echo "SUPABASE_URL=$(jq -r .API_URL "$RUNNER_TEMP/sb.json")"
            echo "SUPABASE_ANON_KEY=$(jq -r .ANON_KEY "$RUNNER_TEMP/sb.json")"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(jq -r .SERVICE_ROLE_KEY "$RUNNER_TEMP/sb.json")"
            echo "MAILPIT_URL=$(jq -r '.MAILPIT_URL // .INBUCKET_URL' "$RUNNER_TEMP/sb.json")"
          } >> "$GITHUB_ENV"
      - name: pgTAP (RLS, grants, server validation, abuse cases)
        run: supabase test db
      - name: HTTP integration attacks
        run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - name: Browser e2e against the local stack
        run: npm run test:e2e:online
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-online-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --exit-code 1
